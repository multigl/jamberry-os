name: Validate Brewfiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom/brew/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # master

      - name: Validate Brewfiles
        shell: bash
        run: |
          echo "Validating Brewfiles in custom/brew/ directory..."

          # `brew bundle check` reports whether entries are *installed*, which is
          # never true on a clean runner, so it fails on any non-empty Brewfile.
          # Parse each file instead, then confirm every entry exists in Homebrew.
          set -euo pipefail

          check_entries() {
            local brewfile="$1" kind="$2" info_flag="$3" entries
            entries=$(brew bundle list --file="$brewfile" "$kind")
            [ -z "$entries" ] && return 0
            while IFS= read -r entry; do
              [ -z "$entry" ] && continue
              if brew info "$info_flag" "$entry" >/dev/null 2>&1; then
                echo "  ✓ $entry"
              else
                echo "  ✗ $entry not found in Homebrew"
                return 1
              fi
            done <<<"$entries"
          }

          find "custom/brew" -iname '*\.Brewfile*' -print0 | \
            while IFS= read -r -d '' brewfile ; do
              echo "::group:: ===$(basename "$brewfile")==="

              # Parses the Ruby DSL, so a syntax error fails here
              if ! brew bundle list --file="$brewfile" --all >/dev/null; then
                echo "✗ $brewfile failed to parse"
                exit 1
              fi

              check_entries "$brewfile" --brews --formula || exit 1
              check_entries "$brewfile" --casks --cask || exit 1

              echo "✓ $brewfile is valid"
              echo "::endgroup::"
            done
