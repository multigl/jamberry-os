---
name: Build and Push Image

# PR builds are disabled by default to save CI minutes. To enable them, add:
#   pull_request:
#     branches:
#       - main
#     paths-ignore:
#       - "**.md"
#       - ".github/workflows/*validate*.yml"
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  schedule:
    - cron: "05 10 * * *" # 10:05am UTC everyday
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  DEFAULT_TAG: "stable"
  REGISTRY_CACHE_WRITE: ${{ github.event_name != 'pull_request' && '1' || '0' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          storage-backend: btrfs
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      - name: Detect changes
        id: detect-changes
        uses: projectbluefin/actions/bootc-build/detect-changes@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build/**'
              - 'custom/**'
              - 'Justfile'

      - name: Build image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: build-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          REGISTRY_CACHE_WRITE: ${{ env.REGISTRY_CACHE_WRITE }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Get version label
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.DEFAULT_TAG }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.number }}

      - name: Save DNF cache
        if: always() && !cancelled() && github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/dnf-cache@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # chunkah repacks the image into evenly sized, package-aligned layers, which
      # is what makes a bootc upgrade download only what changed instead of a few
      # enormous layers. It rewrites the tag in place, so it has to run after the
      # version label is read and before tagging and pushing.
      #
      # No apply-pkg-intervals step: that one groups layers by how often each
      # package updates, and it needs a files/pkg-intervals.tsv produced by a
      # pkg-cadence workflow this repo does not have. Without it chunkah falls
      # back to its default grouping, which still beats no rechunking.
      - name: Rechunk image
        if: github.event_name != 'pull_request'
        id: rechunk-image
        uses: projectbluefin/actions/bootc-build/chunka@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          max-layers: 128

      - name: Tag images
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.generate-tags.outputs.tags }}
          default-tag: ${{ steps.generate-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Keyless OIDC signing through Fulcio, plus a SLSA Build L2 provenance
      # attestation. No cosign keypair and no repository secret: the runner's
      # own id-token is the identity, which is why the permissions block above
      # grants id-token and attestations write.
      #
      # The condition matches the push step exactly rather than only excluding
      # pull requests, because this signs steps.push.outputs.digest — on any run
      # where the push is skipped that output is empty and there is nothing to
      # sign. continue-on-error keeps a Sigstore or Rekor outage from failing a
      # build whose image is already published.
      - name: Sign and publish
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@9623ba6a5577ad1221d76a223c9dacbd9043bd04 # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
